name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Before the build, not after: a tag/metadata mismatch is a one-second
      # check, and finding out about it after a full LTCG build wastes minutes.
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $meta = Get-Content ida-plugin.json -Raw | ConvertFrom-Json
          $tag = "$env:GITHUB_REF_NAME" -replace '^v', ''
          if ($meta.plugin.version -ne $tag) {
            throw "ida-plugin.json says version $($meta.plugin.version) but the tag is $tag. The repository index uses the metadata, so the two must agree."
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore the TTD Replay SDK
        run: nuget install msbuild\packages.config -OutputDirectory packages

      - name: Build
        run: msbuild ida-ttd.slnx -p:Configuration=Release -p:Platform=x64 -t:Rebuild -m:1

      - name: Package
        shell: pwsh
        run: |
          # The plugin package; scripts/package.py says what goes in it and
          # why. (The Sogen backend needs a Sogen build and ships separately.)
          python scripts\package.py --build build\Release --out dist
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }

          # The trace loader on its own as well, for installs without HCLI:
          # the package carries a copy that its setup component puts in
          # place, but a hand install copies this into loaders\ itself.
          Copy-Item build\Release\ttd-loader.dll dist\

      # The checks the plugin repository's indexer applies (schema, entry
      # point present in the archive), run on the zip that will be published.
      - name: Lint the plugin package
        shell: pwsh
        run: |
          python -m pip install --quiet ida-hcli
          # Its exit status is 0 even when validation fails (hcli 0.26), so
          # the verdict comes from the output: "Error:" lines are failures,
          # "Recommendation" lines are advice.
          $out = hcli plugin lint dist\ida-ttd.zip 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or $out -match '(?m)^\s*Error') { throw "hcli plugin lint found errors" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ida-ttd-windows-x86_64
          path: |
            dist/ida-ttd.zip
            dist/ttd-loader.dll

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --generate-notes --title $env:GITHUB_REF_NAME
          }
          gh release upload $env:GITHUB_REF_NAME dist\ida-ttd.zip dist\ttd-loader.dll --clobber
